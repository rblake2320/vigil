name: completion-boundaries
on: [push, pull_request]
jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q tests/test_completion_boundaries.py
      - run: python -m perception.mobile_watch --help
      - run: python -m pip install -r requirements-mobile.txt
      - run: python -m pytest -q tests/test_mobile_package.py
